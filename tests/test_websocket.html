<!DOCTYPE html>
<html>
<head>
    <title>WebSocket测试</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
</head>
<body>
    <h1>ChatCRM WebSocket 测试</h1>
    
    <div>
        <h3>1. 初始化会话</h3>
        <button onclick="initSession()">初始化会话</button>
        <div id="sessionInfo"></div>
    </div>
    
    <div>
        <h3>2. 连接WebSocket</h3>
        <button onclick="connectSocket()">连接WebSocket</button>
        <div id="socketStatus">未连接</div>
    </div>
    
    <div>
        <h3>3. 登录</h3>
        <input type="text" id="username" placeholder="用户名">
        <input type="password" id="password" placeholder="密码">
        <button onclick="login()">登录</button>
        <div id="loginStatus"></div>
    </div>
    
    <div>
        <h3>4. 发送消息</h3>
        <input type="text" id="message" placeholder="输入消息" value="显示所有客户">
        <button onclick="sendMessage()">发送消息</button>
    </div>
    
    <div>
        <h3>5. 确认SQL</h3>
        <button onclick="confirmSql(true)">确认执行</button>
        <button onclick="confirmSql(false)">取消</button>
    </div>
    
    <div>
        <h3>日志</h3>
        <textarea id="log" rows="20" cols="80"></textarea>
        <button onclick="clearLog()">清除日志</button>
    </div>

    <script>
        let socket = null;
        let sessionId = null;
        let currentSqlData = null;
        
        function log(message) {
            const logArea = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            logArea.value += `[${timestamp}] ${message}\n`;
            logArea.scrollTop = logArea.scrollHeight;
            console.log(message);
        }
        
        function clearLog() {
            document.getElementById('log').value = '';
        }
        
        async function initSession() {
            try {
                const response = await fetch('/api/init', { method: 'POST' });
                const data = await response.json();
                
                if (data.success) {
                    sessionId = data.session_id;
                    document.getElementById('sessionInfo').innerHTML = 
                        `Session ID: ${sessionId}<br>可用用户: ${data.available_users.join(', ')}`;
                    log(`会话初始化成功: ${sessionId}`);
                } else {
                    log(`会话初始化失败: ${data.message}`);
                }
            } catch (error) {
                log(`初始化错误: ${error}`);
            }
        }
        
        function connectSocket() {
            socket = io();
            
            socket.on('connect', () => {
                document.getElementById('socketStatus').textContent = '已连接';
                log('WebSocket已连接');
            });
            
            socket.on('disconnect', () => {
                document.getElementById('socketStatus').textContent = '连接断开';
                log('WebSocket连接断开');
            });
            
            socket.on('error', (data) => {
                log(`错误: ${data.message}`);
            });
            
            socket.on('user_message', (data) => {
                log(`用户消息: ${data.message}`);
            });
            
            socket.on('bot_message', (data) => {
                log(`AI回复: ${data.message}`);
                if (data.details) log(`操作详情: ${data.details}`);
            });
            
            socket.on('sql_confirmation', (data) => {
                currentSqlData = data;
                log(`SQL确认: ${data.operation_type} - ${data.sql_query}`);
            });
        }
        
        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            if (!sessionId) {
                log('请先初始化会话');
                return;
            }
            
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, session_id: sessionId })
                });
                
                const data = await response.json();
                document.getElementById('loginStatus').textContent = 
                    data.success ? `登录成功: ${data.user}` : `登录失败: ${data.message}`;
                log(`登录结果: ${data.success ? '成功' : data.message}`);
            } catch (error) {
                log(`登录错误: ${error}`);
            }
        }
        
        function sendMessage() {
            const message = document.getElementById('message').value;
            
            if (!socket || !sessionId) {
                log('请先连接WebSocket并初始化会话');
                return;
            }
            
            log(`发送消息: ${message} (Session: ${sessionId})`);
            socket.emit('send_message', { 
                message: message, 
                session_id: sessionId 
            });
        }
        
        function confirmSql(confirmed) {
            if (!socket || !sessionId || !currentSqlData) {
                log('没有待确认的SQL操作');
                return;
            }
            
            const confirmData = {
                confirmed: confirmed,
                sql_query: currentSqlData.sql_query,
                original_message: currentSqlData.original_message,
                session_id: sessionId
            };
            
            log(`SQL确认: ${confirmed ? '确认' : '取消'} - ${confirmData.sql_query}`);
            socket.emit('confirm_sql', confirmData);
            currentSqlData = null;
        }
    </script>
</body>
</html>
